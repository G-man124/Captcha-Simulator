<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>reCAPTCHA</title>
  <script src="index.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <noscript>
        <p style="color: red;">JavaScript is required to use this CAPTCHA.</p>
    </noscript>
  <div class="captcha-box">
    <div class="canvas-row">
      <canvas id="captchaCanvas" width="180" height="50"></canvas>
      <button type="button" onclick="generateCaptcha()" title="Refresh">↻</button>
    </div>
    <!-- Fixed: Removed space in validateCaptcha -->
    <form onsubmit="validateCaptcha(event)">
      <input type="text" id="captchaInput" placeholder="Enter characters" required autocomplete="off">
      <button type="submit">Verify</button>
    </form>
    <div id="status"></div>
  </div>
</body>
</html>
